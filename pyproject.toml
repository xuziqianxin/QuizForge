[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quizforge"
version = "1.8.8"
description = "终端题库工具:分类题库管理、答题练习(限时模拟考试/错题重练)、历史成绩、查题、超星学习通作业拉取"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2,<9",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "qrcode>=7.4",
    "pycryptodome>=3.20",
]

[tool.setuptools]
packages = ["quizforge"]
